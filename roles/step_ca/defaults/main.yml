---
step_ca_name: "Flokie Internal CA"
step_ca_user: step
step_ca_group: step
step_ca_directory: /etc/step-ca
step_ca_address: ":9000"
step_ca_port: 9000

step_ca_dns_name: ca.ice.land
step_ca_host_dns_name: thorska.ice.land
step_ca_ip_address: 192.168.220.231
step_ca_provisioner_name: admin
step_ca_acme_provisioner_name: acme

# These intentionally remain on the golden image for the competition scenario.
step_ca_key_password: "SMBlyRequired!"
step_ca_provisioner_password: "SMBlyRequired!"

# Short lifetimes make the online CA an availability dependency during the event.
step_ca_x509_min_duration: 5m
step_ca_x509_default_duration: 2h
step_ca_x509_max_duration: 4h
step_ca_ssh_min_duration: 5m
step_ca_ssh_default_duration: 2h
step_ca_ssh_max_duration: 4h

# Lightweight management API. The shared token is intentionally identical on
# every cloned team image so credentials recovered in one pod are reusable.
step_ca_api_listen_address: ":8080"
step_ca_api_port: 8080
step_ca_api_token: "SMBlyRequired!"
step_ca_api_key_password: "SMBlyRequired!"
step_ca_api_directory: /etc/step-ca-api
step_ca_api_artifact_directory: /var/lib/step-ca-api/artifacts
