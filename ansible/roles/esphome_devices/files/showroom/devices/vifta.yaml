esphome:
  name: vifta
  friendly_name: VIFTA
  on_boot:
    priority: -100
    then:
      - fan.turn_on:
          id: ventilation
          speed: 2

host:
  mac_address: "02:1c:4b:5a:00:12"

logger:

api:

fan:
  - platform: template
    id: ventilation
    name: Ventilation
    speed_count: 3

interval:
  - interval: 5s
    then:
      - lambda: |-
          FILE *f = fopen("/run/showroom/vifta", "w");
          if (f != nullptr) {
            int speed = id(ventilation).state ? id(ventilation).speed : 0;
            fprintf(f, "%d %ld\n", speed, (long) time(nullptr));
            fclose(f);
          }

sensor:
  - platform: uptime
    name: Uptime
    update_interval: 15s
