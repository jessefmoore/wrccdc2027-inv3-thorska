name: deploy

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/5 * * * *"

jobs:
  deploy:
    runs-on: thorska
    steps:
      - name: Update checkout
        run: git -C /opt/showroom pull --ff-only
      - name: Apply
        run: ansible-playbook -c local -i localhost, /opt/showroom/deploy.yml
